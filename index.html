<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>CP 왼 른 취향표</title>
    <!-- 이미지 저장을 위한 라이브러리 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* 기본 테마 색상을 변수로 설정 (기본값: 검정) */
        :root {
            --main-color: #000000;
        }

        body {
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            padding: 20px;
        }

        /* 컨트롤 패널 (색상 변경, 버튼들) */
        .controls-panel {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .color-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: opacity 0.2s;
        }
        .color-btn:hover { opacity: 0.8; }

        input[type="color"] {
            border: none;
            width: 40px;
            height: 40px;
            padding: 0;
            cursor: pointer;
            background: none;
        }

        .action-controls {
            display: flex;
            gap: 10px;
        }
        
        .action-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.2s;
        }
        .action-btn:hover { background-color: #555; }
        .save-btn { background-color: #1da1f2; } /* 트위터 느낌의 파란색 */
        .save-btn:hover { background-color: #0c85d0; }

        /* 캡처될 영역 (트위터 고화질 가로 1080px 기준) */
        #capture-area {
            width: 1080px; 
            height: fit-content;
            background-color: white;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 36px; /* 제목을 더 크고 시원하게! */
            font-weight: 900;
            margin-bottom: 30px;
            text-align: center;
            color: var(--main-color);
        }

        .tables-container {
            display: flex;
            gap: 30px; /* 표 사이 간격 */
            width: 100%;
        }

        .table-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 6px solid var(--main-color); /* 테두리 색상 변수 적용 */
        }

        .table-header {
            background-color: var(--main-color); /* 헤더 배경색 변수 적용 */
            color: white;
            text-align: center;
            font-size: 40px;
            font-weight: 900;
            padding: 15px 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px; /* 선 두께 */
            background-color: var(--main-color); /* 선 색상 변수 적용 */
            flex: 1;
        }

        .grid-item {
            background-color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 24px;
            background-size: cover;
            background-position: center;
            aspect-ratio: 1 / 1; /* ★어떤 상황에서도 완벽한 정사각형 유지★ */
            position: relative;
        }

        .grid-item:hover {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>

    <!-- 기능 조작 버튼들 -->
    <div class="controls-panel">
        <div class="color-controls">
            <span style="font-weight: bold; font-size: 16px;">🎨 표 색상 변경:</span>
            <input type="color" id="colorPicker" value="#000000" onchange="changeThemeColor(this.value)">
            <button class="color-btn" style="background-color: #000000;" onclick="changeThemeColor('#000000')">기본(검정)</button>
            <button class="color-btn" style="background-color: #FF7722;" onclick="changeThemeColor('#FF7722')">오렌지</button>
            <button class="color-btn" style="background-color: #0077DD;" onclick="changeThemeColor('#0077DD')">블루</button>
        </div>
        <div class="action-controls">
            <button class="action-btn" onclick="addRow()">➕ 한 줄(레이어) 추가하기</button>
            <button class="action-btn save-btn" onclick="saveAsImage()">📸 예쁘게 이미지로 저장하기</button>
        </div>
    </div>

    <!-- 이미지로 저장될 영역 -->
    <div id="capture-area">
        <div class="header-title">CP 왼 른 취향표</div>
        
        <div class="tables-container">
            <!-- 왼 표 -->
            <div class="table-wrapper">
                <div class="table-header">왼</div>
                <div class="grid-container" id="left-grid"></div>
            </div>
            <!-- 른 표 -->
            <div class="table-wrapper">
                <div class="table-header">른</div>
                <div class="grid-container" id="right-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // 색상 변경 기능
        function changeThemeColor(color) {
            document.documentElement.style.setProperty('--main-color', color);
            document.getElementById('colorPicker').value = color; // 컬러 피커 색상도 동기화
        }

        // 칸 만들기 기능
        function createCell() {
            const cell = document.createElement('div');
            cell.className = 'grid-item';
            cell.innerText = "+"; // 클릭 유도 아이콘 느낌
            
            // 칸 클릭 시 이미지 업로드
            cell.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            cell.style.backgroundImage = `url(${event.target.result})`;
                            cell.innerText = ""; // 이미지가 들어가면 + 기호 숨기기
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            });
            return cell;
        }

        // 줄 추가 기능
        function addRow() {
            const leftGrid = document.getElementById('left-grid');
            const rightGrid = document.getElementById('right-grid');
            
            for(let i=0; i<3; i++) leftGrid.appendChild(createCell());
            for(let i=0; i<3; i++) rightGrid.appendChild(createCell());
        }

        // 페이지 열리자마자 기본 3줄(3x3) 깔아주기
        for(let i=0; i<3; i++) {
            addRow();
        }

        // 이미지 저장 기능 (트위터 업로드용)
        function saveAsImage() {
            const captureArea = document.getElementById('capture-area');
            
            // 약간의 딜레이를 주어 폰트나 이미지가 완전히 불려온 후 캡처되도록 함
            setTimeout(() => {
                html2canvas(captureArea, { 
                    scale: 2, // 고해상도로 저장 (선명하게!)
                    useCORS: true, 
                    backgroundColor: "#ffffff" 
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'CP_취향표_완성.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                });
            }, 100);
        }
    </script>
</body>
</html>
