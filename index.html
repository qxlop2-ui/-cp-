<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP 취향표 메이커</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* 기본은 검정색으로 설정 */
        :root {
            --left-color: #2b2d42; 
            --right-color: #2b2d42; 
            --bg-color: #f4f6f8;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            color: #333;
        }

        .controls-panel {
            background: white;
            padding: 25px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            z-index: 10;
        }

        .colors-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #495057;
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 100px;
        }

        .color-swatch {
            width: 32px; 
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .color-swatch:hover { transform: scale(1.15); }
        
        .custom-color-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        .custom-color-btn input[type="color"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .btn-group { display: flex; gap: 12px; }

        .btn {
            padding: 14px 24px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 15px;
            font-family: 'Pretendard';
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-add { background: #e9ecef; color: #495057; }
        .btn-delete { background: #ffe3e3; color: #fa5252; }
        .btn-save { color: white; transition: transform 0.2s, box-shadow 0.2s; }

        #capture-area {
            width: 1080px; 
            background-color: white;
            padding: 50px;
            box-sizing: border-box;
            border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            transition: all 0.3s;
        }

        .exporting-mode { box-shadow: none !important; border-radius: 0 !important; }

        .header-title {
            font-size: 44px;
            font-weight: 900;
            margin-bottom: 40px;
            text-align: center;
            color: #2b2d42; 
            letter-spacing: -1px; 
        }

        .tables-container { display: flex; gap: 40px; }

        .left-table { --current-theme: var(--left-color); }
        .right-table { --current-theme: var(--right-color); }

        .table-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 3px solid var(--current-theme);
            border-radius: 20px; 
            overflow: hidden; 
        }

        .table-header {
            background-color: var(--current-theme);
            color: white;
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            padding: 20px 0;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .table-header .jp-text { font-size: 22px; font-weight: 600; opacity: 0.85; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px; 
            background-color: var(--current-theme);
        }

        .grid-item {
            background-color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1; 
            position: relative;
            background-size: cover;
            background-position: center;
            transition: background-color 0.2s;
        }

        .grid-item::before {
            content: '+';
            font-size: 32px;
            color: #ced4da;
            font-weight: 300;
        }
        .grid-item.has-image::before { display: none; }
    </style>
</head>
<body>

    <div class="controls-panel">
        <div class="colors-container">
            <!-- 왼 컬러 (기본 검정 + 주황 옵션) -->
            <div class="color-picker-group">
                <span>🎨 왼 컬러:</span>
                <div class="color-swatch" style="background: #2b2d42;" onclick="changeLeftColor('#2b2d42')"></div>
                <div class="color-swatch" style="background: #FF7722;" onclick="changeLeftColor('#FF7722')"></div>
                <label class="color-swatch custom-color-btn">+<input type="color" onchange="changeLeftColor(this.value)"></label>
            </div>

            <!-- 른 컬러 (기본 검정 + 파랑 옵션) -->
            <div class="color-picker-group">
                <span>🎨 른 컬러:</span>
                <div class="color-swatch" style="background: #2b2d42;" onclick="changeRightColor('#2b2d42')"></div>
                <div class="color-swatch" style="background: #0077DD;" onclick="changeRightColor('#0077DD')"></div>
                <label class="color-swatch custom-color-btn">+<input type="color" onchange="changeRightColor(this.value)"></label>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-add" onclick="addRow()">➕ 레이어 추가</button>
            <button class="btn btn-delete" onclick="deleteRow()">➖ 레이어 삭제</button>
            <button class="btn btn-save" id="saveBtn" onclick="saveAsImage()">📸 예쁘게 저장하기</button>
        </div>
    </div>

    <div id="capture-area">
        <div class="header-title">CP 왼 른 취향표</div>
        <div class="tables-container">
            <div class="table-wrapper left-table">
                <div class="table-header">왼 <span class="jp-text">(攻め)</span></div>
                <div class="grid-container" id="left-grid"></div>
            </div>
            <div class="table-wrapper right-table">
                <div class="table-header">른 <span class="jp-text">(受け)</span></div>
                <div class="grid-container" id="right-grid"></div>
            </div>
        </div>
    </div>

    <script>
        function updateSaveButtonColor() {
            const leftColor = getComputedStyle(document.documentElement).getPropertyValue('--left-color').trim();
            const rightColor = getComputedStyle(document.documentElement).getPropertyValue('--right-color').trim();
            document.getElementById('saveBtn').style.background = `linear-gradient(135deg, ${leftColor} 0%, ${rightColor} 100%)`;
        }
        function changeLeftColor(color) {
            document.documentElement.style.setProperty('--left-color', color);
            updateSaveButtonColor();
        }
        function changeRightColor(color) {
            document.documentElement.style.setProperty('--right-color', color);
            updateSaveButtonColor();
        }

        updateSaveButtonColor();

        function createCell() {
            const cell = document.createElement('div');
            cell.className = 'grid-item';
            cell.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            cell.style.backgroundImage = `url(${event.target.result})`;
                            cell.classList.add('has-image'); 
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            });
            return cell;
        }

        function addRow() {
            const leftGrid = document.getElementById('left-grid');
            const rightGrid = document.getElementById('right-grid');
            for(let i=0; i<3; i++) {
                leftGrid.appendChild(createCell());
                rightGrid.appendChild(createCell());
            }
        }

        function deleteRow() {
            const leftGrid = document.getElementById('left-grid');
            const rightGrid = document.getElementById('right-grid');
            if (leftGrid.children.length > 3) {
                for(let i=0; i<3; i++) {
                    leftGrid.removeChild(leftGrid.lastChild);
                    rightGrid.removeChild(rightGrid.lastChild);
                }
            } else {
                alert("최소 1줄은 남겨두어야 해요! 😢");
            }
        }

        for(let i=0; i<3; i++) addRow();

        function saveAsImage() {
            const captureArea = document.getElementById('capture-area');
            captureArea.classList.add('exporting-mode');
            setTimeout(() => {
                html2canvas(captureArea, { scale: 2, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'CP_취향표_완성.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    captureArea.classList.remove('exporting-mode');
                });
            }, 100);
        }
    </script>
</body>
</html>
