<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP 취향표 메이커</title>
    <!-- 트렌디한 폰트: 프리텐다드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <!-- 캡처 라이브러리 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        /* 세련된 기본 테마 색상 (완전 쌩검정보다 살짝 부드러운 다크그레이) */
        :root {
            --theme-color: #2b2d42; 
            --bg-color: #f4f6f8;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            color: #333;
        }

        /* ---------------- MZ 감성 컨트롤 패널 ---------------- */
        .controls-panel {
            background: white;
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #495057;
        }

        /* 동글동글 귀여운 색상 팔레트 */
        .color-swatch {
            width: 36px; 
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .color-swatch:hover {
            transform: scale(1.15);
        }
        
        .custom-color-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: white;
            font-size: 20px;
            font-weight: bold;
        }
        .custom-color-btn input[type="color"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 14px 24px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 15px;
            font-family: 'Pretendard';
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-add {
            background: #e9ecef;
            color: #495057;
        }
        .btn-add:hover { background: #dee2e6; }
        
        .btn-save {
            background: var(--theme-color);
            color: white;
        }
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        /* ---------------- 캡처 영역 (트위터 최적화) ---------------- */
        #capture-area {
            width: 1080px; 
            background-color: white;
            padding: 50px;
            box-sizing: border-box;
            border-radius: 30px; /* 전체 테두리도 둥글게 */
            box-shadow: 0 20px 40px rgba(0,0,0,0.06); /* 은은한 입체감 */
            transition: all 0.3s;
        }

        /* 캡처할 때 그림자를 없애주는 클래스 (깔끔한 이미지 저장을 위해) */
        .exporting-mode {
            box-shadow: none !important;
            border-radius: 0 !important;
        }

        .header-title {
            font-size: 44px;
            font-weight: 900;
            margin-bottom: 40px;
            text-align: center;
            color: var(--theme-color);
            letter-spacing: -1px; /* 자간을 좁혀서 더 트렌디하게 */
        }

        .tables-container {
            display: flex;
            gap: 40px;
        }

        .table-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 3px solid var(--theme-color);
            border-radius: 20px; /* 표 모서리 둥글게 */
            overflow: hidden; /* 둥근 모서리 안쪽 내용물 잘리게 */
        }

        .table-header {
            background-color: var(--theme-color);
            color: white;
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            padding: 20px 0;
            letter-spacing: 2px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px; /* 얇고 세련된 안쪽 선 */
            background-color: var(--theme-color);
        }

        .grid-item {
            background-color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1; /* 완벽한 정사각형 */
            position: relative;
            background-size: cover;
            background-position: center;
            transition: background-color 0.2s;
        }

        .grid-item::before {
            content: '+';
            font-size: 32px;
            color: #ced4da;
            font-weight: 300;
            transition: color 0.2s;
        }
        
        .grid-item:hover::before {
            color: #adb5bd;
        }

        /* 이미지가 들어가면 + 기호 숨기기 */
        .grid-item.has-image::before {
            display: none;
        }
    </style>
</head>
<body>

    <!-- MZ 감성 컨트롤 패널 -->
    <div class="controls-panel">
        <div class="color-picker-group">
            <span>🎨 컬러 픽:</span>
            <!-- 기본 다크그레이 -->
            <div class="color-swatch" style="background: #2b2d42;" onclick="changeThemeColor('#2b2d42')"></div>
            <!-- 요청하신 오렌지 -->
            <div class="color-swatch" style="background: #FF7722;" onclick="changeThemeColor('#FF7722')"></div>
            <!-- 요청하신 블루 -->
            <div class="color-swatch" style="background: #0077DD;" onclick="changeThemeColor('#0077DD')"></div>
            <!-- 자유 선택 (그라데이션 버튼) -->
            <label class="color-swatch custom-color-btn" title="원하는 색상 고르기">
                +
                <input type="color" id="customColor" onchange="changeThemeColor(this.value)">
            </label>
        </div>

        <div class="btn-group">
            <button class="btn btn-add" onclick="addRow()">➕ 레이어 추가</button>
            <button class="btn btn-save" onclick="saveAsImage()">📸 예쁘게 저장하기</button>
        </div>
    </div>

    <!-- 이미지로 저장될 영역 -->
    <div id="capture-area">
        <div class="header-title">CP 왼 른 취향표</div>
        
        <div class="tables-container">
            <!-- 왼 표 -->
            <div class="table-wrapper">
                <div class="table-header">왼</div>
                <div class="grid-container" id="left-grid"></div>
            </div>
            <!-- 른 표 -->
            <div class="table-wrapper">
                <div class="table-header">른</div>
                <div class="grid-container" id="right-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // 테마 색상 변경 기능
        function changeThemeColor(color) {
            document.documentElement.style.setProperty('--theme-color', color);
            // 저장 버튼 색상도 같이 바꿔주기
            document.querySelector('.btn-save').style.backgroundColor = color;
        }

        // 칸 만들기 기능
        function createCell() {
            const cell = document.createElement('div');
            cell.className = 'grid-item';
            
            // 칸 클릭 시 이미지 업로드
            cell.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            cell.style.backgroundImage = `url(${event.target.result})`;
                            cell.classList.add('has-image'); // 클래스 추가해서 + 기호 숨기기
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.click();
            });
            return cell;
        }

        // 줄 추가 기능
        function addRow() {
            const leftGrid = document.getElementById('left-grid');
            const rightGrid = document.getElementById('right-grid');
            
            for(let i=0; i<3; i++) leftGrid.appendChild(createCell());
            for(let i=0; i<3; i++) rightGrid.appendChild(createCell());
        }

        // 초기 세팅: 3줄 만들기
        for(let i=0; i<3; i++) {
            addRow();
        }

        // 고화질 이미지 저장 기능
        function saveAsImage() {
            const captureArea = document.getElementById('capture-area');
            
            // 캡처 전에 임시로 배경 그림자와 둥근 모서리 제거 (깔끔한 사각형 저장을 위해)
            captureArea.classList.add('exporting-mode');

            setTimeout(() => {
                html2canvas(captureArea, { 
                    scale: 2, // 고해상도
                    useCORS: true, 
                    backgroundColor: "#ffffff" // 뒷배경 하얗게
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'CP_취향표_완성.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    
                    // 저장 완료 후 다시 원래 UI로 복구
                    captureArea.classList.remove('exporting-mode');
                });
            }, 100);
        }
    </script>
</body>
</html>
