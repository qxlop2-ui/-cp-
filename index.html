<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CP 취향표 메이커</title>
    <!-- 트렌디한 폰트: 프리텐다드 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    
    <!-- 이미지 저장용 라이브러리 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    
    <!-- 크롭(이미지 자르기) 라이브러리 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <style>
        :root {
            --left-color: #2b2d42; 
            --right-color: #2b2d42; 
            --bg-color: #f4f6f8;
            --btn-theme: #2b2d42;
        }

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            color: #333;
        }

        .controls-panel {
            background: white;
            padding: 25px 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
            z-index: 10;
        }

        .colors-container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: #495057;
            background: #f8f9fa;
            padding: 10px 20px;
            border-radius: 100px;
        }

        .color-swatch {
            width: 32px; 
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .color-swatch:hover { transform: scale(1.15); }
        
        .custom-color-btn {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
        .custom-color-btn input[type="color"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .btn-group { display: flex; gap: 12px; }

        .btn {
            padding: 14px 24px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            font-size: 15px;
            font-family: 'Pretendard';
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-add { background: #e9ecef; color: #495057; }
        .btn-delete { background: #ffe3e3; color: #fa5252; }
        .btn-save { color: white; transition: transform 0.2s, box-shadow 0.2s; }

        #capture-area {
            width: 1080px; 
            background-color: white;
            padding: 50px;
            box-sizing: border-box;
            border-radius: 30px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.06);
            transition: all 0.3s;
            position: relative; /* 이스터 에그 위치 기준점! */
        }

        .exporting-mode { box-shadow: none !important; border-radius: 0 !important; }

        .header-title {
            font-size: 44px;
            font-weight: 900;
            margin-bottom: 40px;
            text-align: center;
            color: #2b2d42; 
            letter-spacing: -1px; 
        }

        .tables-container { display: flex; gap: 40px; }

        .left-table { --current-theme: var(--left-color); }
        .right-table { --current-theme: var(--right-color); }

        .table-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            border: 3px solid var(--current-theme);
            border-radius: 20px; 
            overflow: hidden; 
        }

        .table-header {
            background-color: var(--current-theme);
            color: white;
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            padding: 20px 0;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .table-header .jp-text { font-size: 22px; font-weight: 600; opacity: 0.85; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2px; 
            background-color: var(--current-theme);
        }

        .grid-item {
            background-color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1; 
            position: relative;
            background-size: cover;
            background-position: center;
            transition: background-color 0.2s;
        }

        .grid-item::before {
            content: '+';
            font-size: 32px;
            color: #ced4da;
            font-weight: 300;
        }
        .grid-item.has-image::before { display: none; }

        /* ★ 이스터 에그 스타일! ★ */
        .easter-egg {
            position: absolute;
            bottom: 15px;
            right: 25px;
            font-size: 12px;
            color: #ced4da; /* 아주아주 연한 회색 */
            opacity: 0.8; /* 요청하신 투명도 80% */
            pointer-events: none; /* 클릭 방해 안 되게 */
            user-select: none; /* 드래그도 안 되게 */
            letter-spacing: 1px;
            font-weight: 500;
        }

        /* 크롭 팝업(모달) 꾸미기 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .modal-title {
            margin: 0;
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            color: #2b2d42;
        }
        .img-container {
            width: 100%;
            max-height: 400px; 
            overflow: hidden;
            border-radius: 12px;
            background-color: #f8f9fa;
        }
        .img-container img {
            display: block;
            max-width: 100%;
        }
        .modal-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }
        .modal-btn-cancel {
            background: #f1f3f5;
            color: #495057;
        }
        .modal-btn-apply {
            background: #2b2d42;
            color: white;
        }
    </style>
</head>
<body>

    <div class="controls-panel">
        <div class="colors-container">
            <!-- 왼 컬러 -->
            <div class="color-picker-group">
                <span>🎨 왼 컬러:</span>
                <div class="color-swatch" style="background: #2b2d42;" onclick="changeLeftColor('#2b2d42')"></div>
                <div class="color-swatch" style="background: #FF7722;" onclick="changeLeftColor('#FF7722')"></div>
                <label class="color-swatch custom-color-btn">+<input type="color" onchange="changeLeftColor(this.value)"></label>
            </div>

            <!-- 른 컬러 -->
            <div class="color-picker-group">
                <span>🎨 른 컬러:</span>
                <div class="color-swatch" style="background: #2b2d42;" onclick="changeRightColor('#2b2d42')"></div>
                <div class="color-swatch" style="background: #0077DD;" onclick="changeRightColor('#0077DD')"></div>
                <label class="color-swatch custom-color-btn">+<input type="color" onchange="changeRightColor(this.value)"></label>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-add" onclick="addRow()">➕ 레이어 추가</button>
            <button class="btn btn-delete" onclick="deleteRow()">➖ 레이어 삭제</button>
            <button class="btn btn-save" id="saveBtn" onclick="saveAsImage()">저장하기</button>
        </div>
    </div>

    <!-- 캡처될 영역 -->
    <div id="capture-area">
        <div class="header-title">CP 왼 른 취향표</div>
        <div class="tables-container">
            <div class="table-wrapper left-table">
                <div class="table-header">왼 <span class="jp-text">(攻め)</span></div>
                <div class="grid-container" id="left-grid"></div>
            </div>
            <div class="table-wrapper right-table">
                <div class="table-header">른 <span class="jp-text">(受け)</span></div>
                <div class="grid-container" id="right-grid"></div>
            </div>
        </div>
        
        <!-- ★ 이스터 에그 텍스트 쏙! ★ -->
        <div class="easter-egg">아키토우 화이팅</div>
    </div>

    <!-- 크롭 팝업(모달) -->
    <div class="modal-overlay" id="cropModal">
        <div class="modal-content">
            <h3 class="modal-title">마우스 휠로 확대/ 축소 가능</h3>
            <div class="img-container">
                <img id="cropImage" src="">
            </div>
            <div class="modal-btns">
                <button class="btn modal-btn-cancel" onclick="closeModal()">취소</button>
                <button class="btn modal-btn-apply" id="applyCropBtn" onclick="applyCrop()">완료</button>
            </div>
        </div>
    </div>

    <script>
        function updateSaveButtonColor() {
            const leftColor = getComputedStyle(document.documentElement).getPropertyValue('--left-color').trim();
            const rightColor = getComputedStyle(document.documentElement).getPropertyValue('--right-color').trim();
            document.getElementById('saveBtn').style.background = `linear-gradient(135deg, ${leftColor} 0%, ${rightColor} 100%)`;
            document.getElementById('applyCropBtn').style.background = `linear-gradient(135deg, ${leftColor} 0%, ${rightColor} 100%)`;
        }
        function changeLeftColor(color) {
            document.documentElement.style.setProperty('--left-color', color);
            updateSaveButtonColor();
        }
        function changeRightColor(color) {
            document.documentElement.style.setProperty('--right-color', color);
            updateSaveButtonColor();
        }
        updateSaveButtonColor();

        let cropper = null;
        let currentCell = null; 

        function createCell() {
            const cell = document.createElement('div');
            cell.className = 'grid-item';
            
            cell.addEventListener('click', () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            currentCell = cell;
                            const image = document.getElementById('cropImage');
                            image.src = event.target.result;
                            document.getElementById('cropModal').style.display = 'flex';
                            
                            if (cropper) {
                                cropper.destroy();
                            }
                            
                            cropper = new Cropper(image, {
                                aspectRatio: 1 / 1,
                                viewMode: 1, 
                                dragMode: 'move', 
                                autoCropArea: 1, 
                                restore: false,
                                guides: true, 
                                center: true,
                                highlight: false,
                                cropBoxMovable: false, 
                                cropBoxResizable: false, 
                                toggleDragModeOnDblclick: false,
                            });
                        };
                        reader.readAsDataURL(file);
                    }
                };
                input.value = ''; 
                input.click();
            });
            return cell;
        }

        function closeModal() {
            document.getElementById('cropModal').style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            currentCell = null;
        }

        function applyCrop() {
            if (!cropper) return;
            
            const canvas = cropper.getCroppedCanvas({
                width: 400,
                height: 400, 
                imageSmoothingEnabled: true,
                imageSmoothingQuality: 'high',
            });
            
            if (currentCell) {
                currentCell.style.backgroundImage = `url(${canvas.toDataURL('image/jpeg', 0.9)})`;
                currentCell.classList.add('has-image'); 
            }
            
            closeModal(); 
        }

        function addRow() {
            const leftGrid = document.getElementById('left-grid');
            const rightGrid = document.getElementById('right-grid');
            for(let i=0; i<3; i++) {
                leftGrid.appendChild(createCell());
                rightGrid.appendChild(createCell());
            }
        }

        function deleteRow() {
            const leftGrid = document.getElementById('left-grid');
            const rightGrid = document.getElementById('right-grid');
            if (leftGrid.children.length > 3) {
                for(let i=0; i<3; i++) {
                    leftGrid.removeChild(leftGrid.lastChild);
                    rightGrid.removeChild(rightGrid.lastChild);
                }
            } else {
                alert("최소 1줄은 남겨주세요");
            }
        }

        for(let i=0; i<3; i++) addRow();

        function saveAsImage() {
            const captureArea = document.getElementById('capture-area');
            captureArea.classList.add('exporting-mode'); 
            setTimeout(() => {
                html2canvas(captureArea, { 
                    scale: 2, 
                    useCORS: true, 
                    backgroundColor: "#ffffff" 
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.download = 'CP_취향표_완성.png';
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    captureArea.classList.remove('exporting-mode');
                });
            }, 100);
        }
    </script>
</body>
</html>
